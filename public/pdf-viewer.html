<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Защита ядра операционных систем в условиях противодействия</title>
    <style>
      :root {
        --bg: #050a11;
        --panel: rgba(8, 16, 28, 0.84);
        --text: #e7eef8;
        --text-soft: #aab6c8;
        --accent: #48d3ff;
        --line: rgba(108, 173, 214, 0.16);
        --shadow: 0 18px 54px rgba(0, 0, 0, 0.38);
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
      }

      body {
        color: var(--text);
        background:
          radial-gradient(circle at 50% 12%, rgba(72, 211, 255, 0.12), transparent 28%),
          #050a11;
        overflow: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        min-height: 68px;
        padding: 12px clamp(14px, 3vw, 28px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(5, 10, 17, 0.9);
        backdrop-filter: blur(10px);
      }

      .title {
        min-width: 0;
      }

      .title h1 {
        margin: 0 0 4px;
        font-size: clamp(0.96rem, 2vw, 1.12rem);
        line-height: 1.25;
        font-weight: 700;
      }

      .title p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.84rem;
        line-height: 1.4;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn {
        min-height: 42px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        border: 1px solid rgba(108, 173, 214, 0.18);
        background: rgba(11, 17, 27, 0.72);
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 0 0 1px rgba(108, 173, 214, 0.08);
      }

      .btn-primary {
        color: var(--accent);
        border-color: rgba(72, 211, 255, 0.28);
        background: linear-gradient(180deg, rgba(28, 50, 69, 0.88), rgba(10, 19, 29, 0.88));
      }

      .stage {
        position: relative;
        min-height: 0;
      }

      .loader {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(560px, 100%);
        padding: clamp(22px, 4vw, 34px);
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .status {
        margin: 0 0 14px;
        color: var(--text);
        font-size: clamp(1.02rem, 2.2vw, 1.28rem);
        font-weight: 700;
      }

      .loader-visual {
        width: 86px;
        height: 86px;
        margin: 0 auto 20px;
        position: relative;
        display: grid;
        place-items: center;
      }

      .loader-visual::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 1px solid rgba(72, 211, 255, 0.16);
        border-top-color: rgba(72, 211, 255, 0.86);
        animation: spin 1s linear infinite;
        box-shadow: 0 0 24px rgba(72, 211, 255, 0.1);
      }

      .loader-visual::after {
        content: "PDF";
        width: 48px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        border: 1px solid rgba(72, 211, 255, 0.22);
        background: linear-gradient(180deg, rgba(28, 50, 69, 0.88), rgba(10, 19, 29, 0.88));
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        box-shadow: inset 0 0 22px rgba(72, 211, 255, 0.05);
      }

      .meta {
        min-height: 24px;
        margin: 0 0 18px;
        color: var(--text-soft);
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .progress {
        width: 100%;
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid rgba(72, 211, 255, 0.16);
        background: rgba(255, 255, 255, 0.05);
      }

      .bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(72, 211, 255, 0.72), rgba(138, 230, 255, 0.95));
        box-shadow: 0 0 18px rgba(72, 211, 255, 0.22);
        transition: width 0.18s ease;
      }

      .progress.indeterminate .bar {
        width: 42%;
        animation: slide 1.2s ease-in-out infinite;
      }

      .viewer {
        display: none;
        width: 100%;
        height: 100%;
        border: 0;
        background: #111827;
      }

      .is-opening .loader {
        background: rgba(5, 10, 17, 0.72);
        backdrop-filter: blur(2px);
        z-index: 2;
      }

      .is-opening .viewer {
        display: block;
      }

      .is-ready .loader {
        display: none;
      }

      .is-ready .viewer {
        display: block;
      }

      .error {
        display: none;
        margin-top: 18px;
        color: #ffb4ad;
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .is-error .error {
        display: block;
      }

      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(260%);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 720px) {
        body {
          overflow: auto;
        }

        .shell {
          min-height: 100%;
          height: auto;
          grid-template-rows: auto min(78vh, 760px);
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          width: 100%;
          justify-content: stretch;
        }

        .btn {
          flex: 1 1 140px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Защита ядра операционных систем в условиях противодействия</h1>
        </div>

        <nav class="actions" aria-label="Действия с PDF">
          <a class="btn" href="./">Назад</a>
          <a class="btn btn-primary" href="./korkin-monograph.pdf" target="_blank" rel="noopener noreferrer">
            Открыть напрямую
          </a>
          <a
            class="btn"
            href="https://github.com/IgorKorkin/monograph/releases/download/monograph-2026/korkin-monograph.pdf"
            target="_blank"
            rel="noopener noreferrer"
          >
            Скачать
          </a>
        </nav>
      </header>

      <section class="stage" id="stage">
        <div class="loader" role="status" aria-live="polite">
          <div class="panel">
            <div class="loader-visual" aria-hidden="true"></div>
            <p class="status" id="status">Загружаем PDF</p>
            <p class="meta" id="meta">Подготовка загрузки...</p>
            <div class="progress" id="progress">
              <div class="bar" id="bar"></div>
            </div>
            <p class="error" id="error">
              Не удалось открыть PDF во встроенном просмотрщике. Используйте кнопку
              "Открыть напрямую" или "Скачать".
            </p>
          </div>
        </div>

        <iframe class="viewer" id="viewer" title="PDF монографии"></iframe>
      </section>
    </main>

    <script>
      const pdfUrl = "./korkin-monograph.pdf";
      const stage = document.getElementById("stage");
      const statusNode = document.getElementById("status");
      const metaNode = document.getElementById("meta");
      const progressNode = document.getElementById("progress");
      const barNode = document.getElementById("bar");
      const viewerNode = document.getElementById("viewer");

      const formatBytes = (bytes) => `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds) || seconds < 1) {
          return "меньше минуты";
        }

        if (seconds < 60) {
          return `${Math.ceil(seconds)} сек.`;
        }

        return `${Math.ceil(seconds / 60)} мин.`;
      };

      async function openPdf() {
        try {
          const response = await fetch(pdfUrl, { cache: "force-cache" });

          if (!response.ok || !response.body) {
            throw new Error(`HTTP ${response.status}`);
          }

          const total = Number(response.headers.get("content-length")) || 0;
          const reader = response.body.getReader();
          const chunks = [];
          let loaded = 0;
          const startedAt = performance.now();

          if (!total) {
            progressNode.classList.add("indeterminate");
            metaNode.textContent = "Размер файла определяется браузером...";
          } else {
            metaNode.textContent = `Осталось скачать ${formatBytes(total)}`;
          }

          while (true) {
            const { done, value } = await reader.read();

            if (done) {
              break;
            }

            chunks.push(value);
            loaded += value.byteLength;

            if (total) {
              const percent = Math.min(100, Math.round((loaded / total) * 100));
              const remaining = Math.max(0, total - loaded);
              const elapsedSeconds = Math.max(0.1, (performance.now() - startedAt) / 1000);
              const bytesPerSecond = loaded / elapsedSeconds;
              const remainingSeconds = remaining / bytesPerSecond;
              barNode.style.width = `${percent}%`;
              metaNode.textContent =
                `${percent}% • осталось скачать ${formatBytes(remaining)} • примерно ${formatTime(remainingSeconds)}`;
            } else {
              metaNode.textContent = `Загружено ${formatBytes(loaded)}`;
            }
          }

          statusNode.textContent = "Открываем PDF";
          metaNode.textContent = "Готово";
          barNode.style.width = "100%";
          progressNode.classList.remove("indeterminate");

          const blob = new Blob(chunks, { type: "application/pdf" });
          const objectUrl = URL.createObjectURL(blob);

          statusNode.textContent = "Открываем PDF";
          metaNode.textContent = "Браузер готовит встроенный просмотрщик...";
          progressNode.classList.add("indeterminate");
          stage.classList.add("is-opening");

          const revealViewer = () => {
            setTimeout(() => {
              stage.classList.add("is-ready");
            }, 6500);
          };

          viewerNode.addEventListener("load", revealViewer, { once: true });
          viewerNode.src = `${objectUrl}#view=FitH`;

          setTimeout(() => {
            if (!stage.classList.contains("is-ready")) {
              revealViewer();
            }
          }, 12000);
        } catch (error) {
          stage.classList.add("is-error");
          statusNode.textContent = "Не удалось загрузить PDF";
          metaNode.textContent = error.message || "Ошибка загрузки";
          progressNode.classList.add("indeterminate");
        }
      }

      openPdf();
    </script>
  </body>
</html>
